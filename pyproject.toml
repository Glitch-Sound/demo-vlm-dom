[project]
name = "demo-vlm-dom"
version = "0.1.0"
description = "走行静止画を VLM と DOM で注釈するローカルデモ"
readme = "README.md"
authors = [
    { name = "Glitch" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pillow>=13.0.0",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
demo = "app:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pyright>=1.1.411",
    "pyyaml>=6.0.3",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.2",
]
